name: Validate

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify aggregate skill discovery
        run: |
          npx -y skills add . --list
          npx -y skills add . --list --full-depth

      - name: Verify single skill discovery
        run: |
          npx -y skills add ./skills/noootwo-workflow --list
          npx -y skills add ./skills/noootwo-product --list
          npx -y skills add ./skills/noootwo-design --list
          npx -y skills add ./skills/noootwo-tdd --list
          npx -y skills add ./skills/noootwo-code-health --list
          npx -y skills add ./skills/noootwo-delivery --list
          npx -y skills add ./skills/noootwo-release --list
          npx -y skills add ./skills/noootwo-state --list

      - name: Verify skill workspace
        run: python scripts/validate_skill_workspace.py .

      - name: Verify Python scripts compile
        run: |
          python -m py_compile \
            scripts/validate_skill_workspace.py \
            scripts/sync_local_install.py \
            skills/noootwo-design/scripts/bootstrap_noootwo_harness.py \
            skills/noootwo-design/scripts/design_probe.py \
            skills/noootwo-design/scripts/validate_design_evidence.py \
            skills/noootwo-design/scripts/validate_noootwo_readiness.py \
            skills/noootwo-design/scripts/check_visual_gates.py \
            skills/noootwo-design/scripts/eval_noootwo_artifacts.py \
            skills/noootwo-design/scripts/noootwo_status.py \
            skills/noootwo-state/scripts/noootwo_state.py \
            skills/noootwo-state/scripts/audit_codex_context.py

      - name: Verify Noootwo Design evidence validator
        run: |
          tmpdir="$(mktemp -d)"
          mkdir -p "$tmpdir/.noootwo/design/shots"
          python - "$tmpdir" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          shot = root / ".noootwo/design/shots/primary.png"
          shot.write_bytes(b"\x89PNG\r\n\x1a\n" + b"\0" * 2048)
          (root / ".noootwo/design/probe.json").write_text(json.dumps({
              "target": "index.html",
              "viewports": ["1440x900"],
              "states": ["default"],
              "captures": [{
                  "viewport": "1440x900",
                  "state": "default",
                  "region": "primary",
                  "path": ".noootwo/design/shots/primary.png",
                  "valid": True,
              }],
              "results": [{"viewport": "1440x900", "state": "default"}],
              "blockers": [],
          }), encoding="utf-8")
          (root / ".noootwo/design/review.json").write_text(json.dumps({
              "target": "index.html",
              "command": "critique",
              "viewports": ["1440x900"],
              "states": ["default"],
              "findings": [],
              "disposition": "ship",
              "reviewer": "builder",
              "local_only": True,
              "next_action": "none",
          }), encoding="utf-8")
          PY
          python skills/noootwo-design/scripts/validate_design_evidence.py "$tmpdir"
          python - "$tmpdir" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          path = root / ".noootwo/design/probe.json"
          payload = json.loads(path.read_text())
          payload["captures"][0]["path"] = ".noootwo/design/shots/missing.png"
          path.write_text(json.dumps(payload), encoding="utf-8")
          PY
          if python skills/noootwo-design/scripts/validate_design_evidence.py "$tmpdir"; then
            echo "Expected missing design capture to fail validation"
            exit 1
          fi

      - name: Verify Noootwo State scripts
        run: |
          sh -n skills/noootwo-state/scripts/noootwo-state.sh
          python skills/noootwo-state/scripts/noootwo_state.py --self-test
          python skills/noootwo-state/scripts/audit_codex_context.py --self-test

      - name: Verify Noootwo Design harness bootstrap
        run: |
          tmpdir="$(mktemp -d)"
          python skills/noootwo-design/scripts/bootstrap_noootwo_harness.py "$tmpdir" --profile full
          test -f "$tmpdir/AGENTS.md"
          test -f "$tmpdir/.noootwo/system.md"
          test -f "$tmpdir/.noootwo/design-tokens.md"
          test -f "$tmpdir/.noootwo/adoption.md"
          test -f "$tmpdir/.noootwo/product-facts.md"
          test -f "$tmpdir/.noootwo/brief.md"
          test -f "$tmpdir/.noootwo/style-discovery.md"
          test -f "$tmpdir/.noootwo/reference-board.md"
          test -f "$tmpdir/.noootwo/directions.md"
          test -f "$tmpdir/.noootwo/review.md"
          test -f "$tmpdir/.noootwo/handoff/implementation.md"
          test -f "$tmpdir/.noootwo/handoff/acceptance.md"
          test -f "$tmpdir/.noootwo/handoff/assets.md"
          if python skills/noootwo-design/scripts/validate_noootwo_readiness.py "$tmpdir" --allow-non-ready; then
            echo "Expected pending bootstrap harness to fail readiness validation"
            exit 1
          fi
