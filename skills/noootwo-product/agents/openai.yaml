interface:
  display_name: "Noootwo Product"
  short_description: "Product Decision Interview, discovery, scope, flow, and design handoff"
  default_prompt: "Use $noootwo-product before design or implementation when real user, first loop, scope, IA/main path, states, acceptance, or product choice is unclear. Run Decision Interview one material question at a time: inspect facts first, ask only user tradeoffs, offer 2-3 options with a recommended default, and stop once the path is ready. Use Product Reality Check for user-confusing, naive-AI, greenfield, or rejected product direction; hand off to Design only when the main path and states are clear."
