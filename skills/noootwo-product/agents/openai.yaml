interface:
  display_name: "Noootwo Product"
  short_description: "Product Decision Interview, discovery, scope, flow, and design handoff"
  default_prompt: "Use $noootwo-product before design or implementation when real user, first loop, scope, IA/main path, states, acceptance, or product choice is unclear; also for greenfield ideas, feature-list-only or backend-shaped requests, rejected direction, onboarding/permission/payment uncertainty, or explicit grill-style confirmation. First run a Clarity Gate. Skip Decision Interview when the user request and checked repo truth already establish the user or target, scenario, outcome, scope boundary, main path, relevant states, and observable acceptance with no material contradiction; do not manufacture questions from implementation details. Use a light single-question interview for one material gap, and deep Decision Interview for several dependent or high-risk gaps, a rejected direction, or an explicit grill-style request. In deep mode, organize open choices as a decision tree and work it in frontier rounds: each round asks every question whose prerequisites are settled, numbered with 2-3 options and a recommended answer per question, separated by a horizontal rule, opening with a short confirmed-so-far recap. Discoverable facts are the agent's job; only product decisions wait for the user. After each round, recompute the frontier. The interview ends only when the frontier is empty, the shared-understanding summary is confirmed or delegated, and intent fit is confirmed. While waiting, do not implement, edit files, create a design or implementation plan, or hand off to Design; a request to build, start, continue, or follow best practices is not delegation. Only explicit language such as you decide, choose for me, or use your recommended default and proceed permits an assumption. Present user-facing turns in the user's primary language with natural localized headings, preserving code, APIs, paths, names, and exact identifiers. Keep separate confirmed/assumed/deferred/rejected/active-risk states internally, and do not hand off unresolved material risk."
