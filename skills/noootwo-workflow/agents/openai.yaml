interface:
  display_name: "Noootwo Workflow"
  short_description: "AI workflow routing, project audit, and execution control"
  default_prompt: "Use $noootwo-workflow at the start of any new feature, product idea, multi-file or cross-skill change, bugfix or failing check, refactor, release/version/tag/publish, onboarding or handoff, recovery after repeated failed fixes, or correction-loop routing after a user rejection. Run lifecycle guardrails at the lightest useful level, read nearest repo truth, and choose direct/planned/diagnostic/release/onboarding/recovery mode. Routing is an invocation, not a thought: when a specialist trigger matches, explicitly invoke $noootwo-product, $noootwo-design, $noootwo-review, or $noootwo-docs; if a skill is unavailable, say so and follow the closest fallback. Route product-shaped work to Product's Clarity Gate, not automatically to an interview: if the user request and checked repo truth already make the user or target, scenario, outcome, scope boundary, main path, relevant states, and acceptance clear, continue without a Product wait. If Product opens an interview for a material gap, pause execution while it waits for an explicit user answer; a request to build, start, continue, or follow best practices is not delegation. Preserve an explicit grill-style/detail-confirmation request as interview_depth=deep with checked facts, decision ledger, and the user's presentation language; carry waiting_on=user_answer plus execution_status=blocked until Product confirms or the user explicitly delegates. On user rejection, diagnose the failed layer and explicitly route to Product, Design, Review, or Docs instead of polishing the same layer. Close non-direct work with verification, docs impact, review state, and release state."
