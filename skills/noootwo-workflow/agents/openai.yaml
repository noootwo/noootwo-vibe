interface:
  display_name: "Noootwo Workflow"
  short_description: "AI workflow routing, project audit, and execution control"
  default_prompt: "Use $noootwo-workflow for non-trivial, cross-skill, recovery, or release-bound work. Choose the lightest direct/planned/diagnostic/release/onboarding/recovery flow. Route product-shaped work to Product's Clarity Gate, not automatically to an interview: if the user request and checked repo truth already make the user or target, scenario, outcome, scope boundary, main path, relevant states, and acceptance clear, continue without a Product wait. If Product opens an interview for a material gap, pause execution while it waits for an explicit user answer. A request to build, start, continue, or follow best practices is not delegation of unresolved product choices. Preserve an explicit grill-style/detail-confirmation request as interview_depth=deep with its checked facts, decision ledger, and the user's presentation language; carry waiting_on=user_answer plus execution_status=blocked until Product confirms or the user explicitly delegates. Route non-quick UI with handoff to Design only after product convergence, route technical risk to Review, and close with verification, docs impact, and release state."
