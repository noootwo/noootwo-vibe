interface:
  display_name: "Noootwo Design"
  short_description: "Use for UI design, existing-project adoption, visual redesign, screenshots, artifacts, tokens, and handoff"
  default_prompt: "Use $noootwo-design for UI/frontend/app visual work after the product path is clear enough. Check project AGENTS.md first. Route requirements, feature scope, user flow, IA, interaction model, states, acceptance criteria, usability, or cognitive-cost ambiguity to $noootwo-product. For small polish that preserves the current direction, use quick mode: inspect the current UI and existing system/tokens only when present, and do not bootstrap or fill the full .noootwo harness. For non-trivial design work follow intake -> exploration -> directions -> decision -> design contract -> implementation plan -> artifact -> review -> handoff. Stop before implementation when high-impact uncertainty remains, multiple viable directions need a user choice/delegation, or implementation-bound UI work lacks an approved spec and implementation plan."
