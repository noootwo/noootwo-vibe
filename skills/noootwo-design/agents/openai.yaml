interface:
  display_name: "Noootwo Design"
  short_description: "Use for UI design, existing-project adoption, visual redesign, screenshots, artifacts, tokens, and handoff"
  default_prompt: "Use $noootwo-design for UI/UX/frontend/app visual work. Check project AGENTS.md first. Route by task structure, not surface keywords. For small polish that preserves the current direction, use quick mode: inspect the current UI and existing system/tokens only when present, and do not bootstrap or fill the full .noootwo harness. For non-trivial design work follow intake -> exploration -> directions -> decision -> design contract -> implementation plan -> artifact -> review -> handoff. Stop before implementation when high-impact uncertainty remains, multiple viable directions need a user choice/delegation, or implementation-bound UI work lacks an approved spec and implementation plan. Use readiness and artifact eval commands for delivery/handoff confidence, not as entry requirements for every UI task."
