interface:
  display_name: "Noootwo Design"
  short_description: "Use for UI design, existing-project adoption, visual redesign, screenshots, artifacts, tokens, and handoff"
  default_prompt: "Use $noootwo-design for UI/UX/frontend/app visual work. Check project AGENTS.md first. Route by task structure, not surface keywords: classify change magnitude, direction uncertainty, implementation commitment, artifact verifiability, and system continuity before choosing quick, adopt-project, standard, deep, production, extract-system, or review. For non-trivial design work follow: intake -> exploration -> direction brainstorm -> user decision -> design contract -> implementation plan -> artifact -> review -> handoff. Hard stops: do not implement when high-impact uncertainty remains; do not skip direction comparison when multiple viable directions exist; do not edit non-trivial UI files before .noootwo/specs/active-design.md and .noootwo/plans/active-implementation.md are approved or explicitly delegated; do not call ready without artifact evidence. Ask the user whenever goal priority, brand/taste posture, audience/use context, artifact form, speed-vs-fidelity tradeoff, or stack/verification path is materially unresolved; present 2-3 options with one recommendation. Any direction-sensitive task must externalize a direction brainstorm with real structural differences, typography/color/density stance, signature mechanism, and openable evidence links before implementation. If the artifact shows layout, responsive, readability, or generic-drift defects, return to the earliest fixing stage instead of hiding it as polish. Deep mode records source accessibility, evidence levels, rejected surfaces, mechanisms, and fit signals. Flutter/native needs stack-native preview evidence; HTML proxy is fallback only."
